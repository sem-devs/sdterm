appId: com.semdevs.sdterm
productName: sdterm
copyright: Copyright © SEM Devs
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!.github/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,components.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # node-pty ships native binaries and a spawn-helper executable that cannot run from inside the asar.
  - node_modules/node-pty/**
# The same names on every platform, so the website can link them predictably.
artifactName: ${name}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Ad-hoc signature ("-"): valid on its own, tied to no Apple account. Replace with a Developer ID
  # identity (and set notarize: true) once SEM Devs has an Apple Developer ID certificate.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: A terminal needs access to your folders to run commands there.
    - NSDownloadsFolderUsageDescription: A terminal needs access to your folders to run commands there.
    - NSDesktopFolderUsageDescription: A terminal needs access to your folders to run commands there.
  notarize: false
dmg:
  title: ${productName} ${version}
  icon: build/icon.icns

win:
  icon: build/icon.ico
  executableName: sdterm
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  artifactName: ${name}-${version}-${os}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

linux:
  icon: build/icons
  category: System;TerminalEmulator
  maintainer: SEM Devs <info@sem-devs.com>
  synopsis: A terminal workspace
  description: Many terminals in one window, each with a name, a note and a color, with live resource monitors.
  executableName: sdterm
  desktop:
    entry:
      StartupWMClass: sdterm
      Keywords: terminal;shell;console;
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
appImage:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}

npmRebuild: false
