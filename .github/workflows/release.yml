name: Build installers

# Builds sdterm installers. Run it by hand (Actions, "Build installers") and pick one platform, or all.
# macOS and Windows installers can also be built on a Mac with npm run build:mac / build:win; this is
# mainly for Linux, which needs a Linux machine because node-pty is compiled there.
# Pushing a tag like v1.0.3 builds everything and drafts a GitHub release.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [linux, macos, windows, all]
        default: linux
  push:
    tags: ['v*']

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          all='[
            {"key":"macos","name":"macOS (Apple Silicon and Intel)","os":"macos-latest","script":"build:mac","artifact":"sdterm-macos","files":"dist/*.dmg\ndist/*.zip\ndist/latest-mac.yml"},
            {"key":"windows","name":"Windows (x64 and ARM64)","os":"windows-latest","script":"build:win","artifact":"sdterm-windows","files":"dist/*.exe\ndist/latest.yml"},
            {"key":"linux","name":"Linux (x64)","os":"ubuntu-latest","script":"build:linux","artifact":"sdterm-linux","files":"dist/*.AppImage\ndist/*.deb\ndist/latest-linux.yml"}
          ]'
          echo "matrix=$(echo "$all" | jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .key == $p))')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node-pty has no prebuilt binary for Linux, so it is compiled during npm ci.
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libarchive-tools rpm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: installers/*
